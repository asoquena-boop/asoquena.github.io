<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Super Shopping List</title>
<style>
    :root {
        --bg: #edf0f5;
        --text: #222;
        --card: white;
        --accent: #4a90e2;
        --accent-dark: #357ABD;
    }
    .dark {
        --bg: #1b1b1b;
        --text: #f1f1f1;
        --card: #2a2a2a;
        --accent: #8ab4ff;
        --accent-dark: #5b8fe0;
    }

    body {
        font-family: 'Poppins', sans-serif;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity:1; transform: translateY(0);} }
    @keyframes pop { 0%{transform:scale(.9);}60%{transform:scale(1.05);}100%{transform:scale(1);} }

    button {
        padding: 10px 14px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: white;
        cursor: pointer;
        font-weight: 600;
        transition: 0.3s;
    }
    button:hover { background: var(--accent-dark); transform: translateY(-3px); }

    table {
        width: 100%; max-width: 600px;
        margin-top: 20px;
        border-collapse: collapse;
        background: var(--card);
        border-radius: 10px;
        overflow: hidden;
        animation: fadeIn .5s;
    }
    th {
        background: var(--accent);
        padding: 12px;
        color: white;
    }
    td { padding: 10px; border-bottom: 1px solid #4442; }
    tr:hover { background: #0001; }

    #total { font-size: 22px; margin-top: 15px; font-weight: bold; animation: pop .5s; }

    .row-btn { background: crimson; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
    .row-btn.edit { background: orange; }

    @media (max-width: 600px) {
        body { padding: 10px; }
        table { font-size: 14px; }
        input { width: 90%; }
    }
</style>
</head>
<body>

<h2>Super Shopping List</h2>
<button onclick="toggleDarkMode()">🌙 Toggle Dark Mode</button><br><br>

<label>Item Name:</label>
<input type="text" id="itemName"><br>
<label>Price:</label>
<input type="number" id="itemPrice"><br>

<button onclick="addItem()">Add Item</button>
<button onclick="removeItem()">Remove Last Item</button>

<div id="tableDiv"></div>
<div id="total"></div>

<script>
    let items = [];

    function toggleDarkMode() {
        document.body.classList.toggle('dark');
    }

    function save() {
        localStorage.setItem("shoppingList", JSON.stringify(items));
    }

    function load() {
        const data = localStorage.getItem("shoppingList");
        if (data) items = JSON.parse(data);
        updateDisplay();
    }

    function addItem() {
        const name = document.getElementById('itemName').value;
        const price = parseFloat(document.getElementById('itemPrice').value);
        if (name === '' || isNaN(price)) return alert('Enter valid item and price');
        items.push({ itemName: name, price: price });
        save(); updateDisplay();
    }

    function deleteItem(index) {
        items.splice(index, 1);
        save(); updateDisplay();
    }

    function editItem(index) {
        const newName = prompt("Enter new name", items[index].itemName);
        const newPrice = parseFloat(prompt("Enter new price", items[index].price));
        if (!newName || isNaN(newPrice)) return;
        items[index].itemName = newName;
        items[index].price = newPrice;
        save(); updateDisplay();
    }

    function removeItem() {
        items.pop(); save(); updateDisplay();
    }

    function updateDisplay() {
        let html = `<table><tr><th>Item</th><th>Price</th><th>Actions</th></tr>`;
        let total = 0;

        items.forEach((obj, i) => {
            total += obj.price;
            html += `<tr>
                        <td>${obj.itemName}</td>
                        <td>${obj.price.toFixed(2)}</td>
                        <td>
                            <button class='row-btn edit' onclick='editItem(${i})'>Edit</button>
                            <button class='row-btn' onclick='deleteItem(${i})'>Delete</button>
                        </td>
                     </tr>`;
        });

        html += `</table>`;
        document.getElementById('tableDiv').innerHTML = html;
        document.getElementById('total').innerText = 'Total Cost: ' + total.toFixed(2);
    }

    load();
</script>
</body>
</html>
